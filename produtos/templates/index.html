<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
</head>
<body>
    <h1>Sapatos</h1>
    <ul>
        {% for p in produtos %}
        <li>
        <a href="/produtos/{{ p.id }}">{{ p.marca }} {{ p.modelo }}</a> - {{ p.preco }}€
        (tamanhos: {{ p.tamanhos | join(", ") }})
        </li>
        {% endfor %}
    </ul>
    
</body>
</html>
